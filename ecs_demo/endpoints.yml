# -*- coding: utf-8 -*-
# 端点配置文件

# LLM模型配置
models:
  # 命令生成：意图分类+槽位提取，简单任务，不需要思考
  command:
    type: openai
    model: qwen3.6-plus
    api_key: ${DASHSCOPE_API_KEY}
    api_base: https://llm-xcmc3bcdk6yz5n2b.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    temperature: 0.1
    max_tokens: 1024
    enable_thinking: false

  # RAG 回答：检索结果转自然语言，照抄+排版，不需要思考
  rag:
    type: openai
    model: qwen3.6-plus
    api_key: ${DASHSCOPE_API_KEY}
    api_base: https://llm-xcmc3bcdk6yz5n2b.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    temperature: 0.1
    max_tokens: 4096
    enable_thinking: false

  # GraphRAG：Cypher 生成/验证/校正，复杂代码生成，保留思考
  graphrag:
    type: openai
    model: qwen3.6-plus
    api_key: ${DASHSCOPE_API_KEY}
    api_base: https://llm-xcmc3bcdk6yz5n2b.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    temperature: 0
    max_tokens: 8192
    enable_thinking: true

# 向量存储配置 (Neo4j)
vector_store:
  uri: bolt://52.231.65.205:7687
  user: neo4j
  password: ${NEO4J_PASSWORD}

# 数据库配置 (MySQL)
database:
  url: mysql+pymysql://root:${MYSQL_PASSWORD}@52.231.65.205:3306/ecommerce

# Tracker存储配置
tracker_store:
  type: memory

# NLG配置
nlg:
  rephrase_enabled: false
